  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text); padding: 20px; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; background: var(--card-bg); border-radius: 12px; margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .stats { display: flex; gap: 20px; font-weight: bold; font-size: 1.1rem; }

    /* 類別頁籤 */
    .category-tabs {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
    }
    .tab-btn {
      background: var(--card-bg); color: var(--text-dim); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    /* 篩選等級 (上中下游) */
    .tier-filters { display: flex; gap: 10px; margin-bottom: 20px; }
    .filter-btn {
      background: transparent; color: var(--text-dim); border: 1px solid var(--border);
      padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }
    .filter-btn.active { background: #475569; color: #fff; }

    /* 產業卡片網格 */
    .industry-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-title { font-size: 1.1rem; font-weight: bold; }
    .tier-tag {
      font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: bold;
    }
    .tier-1 { background: #065f46; color: #6ee7b7; }
    .tier-2 { background: #1e40af; color: #93c5fd; }
    .tier-3 { background: #831843; color: #f9a8d4; }

    .card-info { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }
    .buy-btn {
      background: var(--accent); color: white; border: none; padding: 10px;
      border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s;
    }
    .buy-btn:hover { opacity: 0.9; }
    .buy-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>

    let currentCategory = 'all';
    let currentTier = 'all';

    // 初始化頁面
    function init() {
      renderCategoryTabs();
      renderIndustries();
      startGameLoop();
    }

    // 渲染 9 大頁籤
    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = CATEGORIES.map(cat => `
        <button class="tab-btn ${cat.id === currentCategory ? 'active' : ''}" onclick="switchCategory('${cat.id}')">
          ${cat.name}
        </button>
      `).join('');
    }

    // 渲染產業卡片
    function renderIndustries() {
      const grid = document.getElementById('industry-grid');
      
      const filtered = GAME_INDUSTRIES.filter(ind => {
        const catMatch = currentCategory === 'all' || ind.cat === currentCategory;
        const tierMatch = currentTier === 'all' || ind.tier.toString() === currentTier;
        return catMatch && tierMatch;
      });

      grid.innerHTML = filtered.map(ind => {
        const count = player.owned[ind.id] || 0;
        const tierClass = `tier-${ind.tier}`;
        const tierName = ind.tier === 1 ? 'T1 基礎原物料' : ind.tier === 2 ? 'T2 中游加工' : 'T3 終端/零售';

        return `
          <div class="card">
            <div>
              <div class="card-header">
                <div class="card-title">${ind.name}</div>
                <span class="tier-tag ${tierClass}">${tierName}</span>
              </div>
              <div class="card-info">
                💰 建造成本: $${ind.cost.toLocaleString()}<br>
                📈 基礎收益: +$${ind.income}/秒<br>
                📥 消耗原料: ${ind.in}<br>
                📤 產出產品: ${ind.out}<br>
                🏭 已擁有: <strong>${count}</strong> 座
              </div>
            </div>
            <button class="buy-btn" onclick="buyIndustry('${ind.id}')" ${player.money < ind.cost ? 'disabled' : ''}>
              建造 (+1)
            </button>
          </div>
        `;
      }).join('');
    }

    // 切換類別
    function switchCategory(catId) {
      currentCategory = catId;
      renderCategoryTabs();
      renderIndustries();
    }

    // 綁定階級篩選按鈕
    document.getElementById('tier-filters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentTier = e.target.dataset.tier;
        renderIndustries();
      }
    });

    // 購買產業
    function buyIndustry(id) {
      const ind = GAME_INDUSTRIES.find(item => item.id === id);
      if (ind && player.money >= ind.cost) {
        player.money -= ind.cost;
        player.owned[id] = (player.owned[id] || 0) + 1;
        updateUI();
      }
    }

    // 更新 UI 數據
    function updateUI() {
      document.getElementById('money-display').innerText = Math.floor(player.money).toLocaleString();
      
      const totalOwned = Object.values(player.owned).reduce((a, b) => a + b, 0);
      document.getElementById('owned-count').innerText = totalOwned;

      renderIndustries();
    }

    // 每秒收益循環
    function startGameLoop() {
      setInterval(() => {
        let secondIncome = 0;
        GAME_INDUSTRIES.forEach(ind => {
          const count = player.owned[ind.id] || 0;
          secondIncome += count * ind.income;
        });

        player.money += secondIncome;
        document.getElementById('money-display').innerText = Math.floor(player.money).toLocaleString();
      }, 1000);
    }

    window.onload = init;
  </script>
