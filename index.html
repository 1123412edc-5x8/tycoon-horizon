<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業帝國：全產業升級版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-building"></i> 企業帝國：全產業升級版</h2>
    
    <div id="active-task-box" style="display:none;">
        <div class="flex-between">
            <b><i class="fa-solid fa-industry"></i> 當前生產：<span id="task-name">無</span></b>
            <span id="task-time">0s / 0s</span>
        </div>
        <div class="progress-bar"><div id="task-progress" class="progress-fill"></div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('overview')">企業總覽</button>
        <button class="tab-btn" onclick="switchTab('production')">生產線 (T1-T15)</button>
        <button class="tab-btn" onclick="switchTab('market')">市場交易</button>
        <button class="tab-btn" onclick="switchTab('wiki')">商業百科</button>
    </div>

    <!-- 企業總覽 -->
    <div id="tab-overview" class="tab-content active">
        <h3>財務與資產統計</h3>
        <div class="grid-2 card" id="inventory-summary-box">
            <div><i class="fa-solid fa-money-bill-wave" style="color:var(--success);"></i> 現金: <b id="cash" style="font-size:1.2em;">$0</b></div>
            <div><i class="fa-solid fa-cubes"></i> 基礎原料 (T1-T5): <b id="inv-t1-sum">0</b></div>
            <div><i class="fa-solid fa-boxes-stacked"></i> 中游加工品 (T6-T10): <b id="inv-t2-sum">0</b></div>
            <div><i class="fa-solid fa-box-open"></i> 高階終端品 (T11-T15): <b id="inv-t3-sum">0</b></div>
        </div>
        <h3>倉庫詳細清單</h3>
        <div class="card">
            <div id="inventory-detail-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px;"></div>
        </div>
    </div>

    <!-- 生產線 -->
    <div id="tab-production" class="tab-content">
        <div class="grid-3" id="industry-production-list"></div>
    </div>

    <!-- 市場交易 -->
    <div id="tab-market" class="tab-content">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h3><i class="fa-solid fa-store"></i> 物品出售</h3>
            <label>選擇物品：</label>
            <select id="sell-item" onchange="updateMarketPriceDisplay()"></select>
            <div class="flex-between" style="margin-bottom: 10px;">
                <span>目前市價: <b id="market-unit-price" style="color:var(--success)">$0</b> / 個</span>
                <span>庫存數量: <b id="market-inventory-qty">0</b></span>
            </div>
            <label>出售數量：</label>
            <input type="number" id="sell-qty" value="1" min="1" oninput="updateMarketPriceDisplay()">
            <div style="margin: 10px 0; font-size: 1.1em; text-align: right;">
                預計收入: <b id="market-total-revenue" style="color:var(--success)">$0</b>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="executeSell()"><i class="fa-solid fa-coins"></i> 確認出售</button>
        </div>
    </div>

    <!-- 商業百科 -->
    <div id="tab-wiki" class="tab-content">
        <h3><i class="fa-solid fa-book"></i> 科技與產業樹狀圖</h3>
        <div class="card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>產業類別</th>
                        <th>核心產物線 (T1 → T15)</th>
                        <th><i class="fa-solid fa-lock"></i> 終極解鎖科技</th>
                        <th>研發資金需求</th>
                        <th>前置解鎖產業</th>
                    </tr>
                </thead>
                <tbody id="industry-tree-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="app.js"></script>
</body>
</html>
