<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自由大亨：全球市場 v2.4</title>
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 頂部資訊欄 -->
        <header class="top-bar">
            <div class="logo"><i class="fa-solid fa-chart-line"></i> 自由大亨</div>
            <div class="user-info">
                <span id="user-email"><i class="fa-solid fa-user"></i> 未登入</span>
                <span id="user-cash"><i class="fa-solid fa-coins"></i> $0</span>
                <button id="auth-btn" onclick="toggleAuthModal()"><i class="fa-solid fa-right-to-bracket"></i> 登入 / 註冊</button>
            </div>
        </header>

        <!-- 主要導覽頁籤 -->
        <nav class="main-nav">
            <button class="nav-btn active" onclick="switchTab('industry')"><i class="fa-solid fa-industry"></i> 產業帝國</button>
            <button class="nav-btn" onclick="switchTab('warehouse')"><i class="fa-solid fa-warehouse"></i> 物資倉庫</button>
            <button class="nav-btn" onclick="switchTab('market')"><i class="fa-solid fa-store"></i> 全球交易所</button>
            <button class="nav-btn" onclick="switchTab('items')"><i class="fa-solid fa-box-open"></i> 道具背包</button>
            <button class="nav-btn" onclick="switchTab('redeem')"><i class="fa-solid fa-ticket"></i> 禮包兌換</button>
            <button class="nav-btn admin-only" id="admin-tab-btn" onclick="switchTab('admin')" style="display:none;"><i class="fa-solid fa-user-shield"></i> 後台管理</button>
        </nav>

        <!-- 主要內容區域 -->
        <main class="content-area">
            <!-- 產業分頁 -->
            <section id="tab-industry" class="tab-content active">
                <div class="category-filter" id="category-filter">
                    <!-- 動態生成 9 大分類按鈕 -->
                </div>
                <div class="industry-grid" id="industry-grid">
                    <!-- 動態生成 135 個產業卡片 -->
                </div>
            </section>

            <!-- 倉庫分頁 -->
            <section id="tab-warehouse" class="tab-content">
                <h2><i class="fa-solid fa-boxes-stacked"></i> 企業物資儲藏庫</h2>
                <div class="warehouse-grid" id="warehouse-grid"></div>
            </section>

            <!-- 交易所分頁 -->
            <section id="tab-market" class="tab-content">
                <h2><i class="fa-solid fa-scale-balanced"></i> 全球即時交易所</h2>
                <div class="market-container">
                    <div class="market-section">
                        <h3>政府緊急採購（保底變現）</h3>
                        <div id="gov-procurement" class="gov-grid"></div>
                    </div>
                    <div class="market-section">
                        <h3>玩家掛單市場</h3>
                        <div id="market-listings" class="listings-grid"></div>
                    </div>
                </div>
            </section>

            <!-- 道具背包分頁 -->
            <section id="tab-items" class="tab-content">
                <h2><i class="fa-solid fa-briefcase"></i> 特殊道具與卡片</h2>
                <div class="items-grid" id="items-grid"></div>
            </section>

            <!-- 禮包兌換分頁 -->
            <section id="tab-redeem" class="tab-content">
                <h2><i class="fa-solid fa-gift"></i> 兌換禮包碼</h2>
                <div class="redeem-box">
                    <input type="text" id="redeem-code-input" placeholder="請輸入兌換碼（預設：zxcvb123）">
                    <button onclick="redeemCode()"><i class="fa-solid fa-check"></i> 立即兌換</button>
                </div>
            </section>

            <!-- 管理員後台 -->
            <section id="tab-admin" class="tab-content">
                <h2><i class="fa-solid fa-sliders"></i> 全球市場後台控制台</h2>
                <div class="admin-panel">
                    <div class="admin-card">
                        <h3>新增禮包兌換碼</h3>
                        <input type="text" id="admin-code-name" placeholder="兌換碼名稱">
                        <input type="number" id="admin-code-cash" placeholder="獎勵金額">
                        <input type="number" id="admin-code-limit" placeholder="限額人數">
                        <button onclick="adminCreateCode()">建立兌換碼</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast 提示元件 -->
    <div id="toast-container"></div>

    <script src="[https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js](https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js)"></script>
    <script src="[https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js](https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js)"></script>
    <script src="[https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js](https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js)"></script>
    <script src="app.js"></script>
</body>
</html>
